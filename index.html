<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YounixLabs - URL Encoder/Decoder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <div class="header-branding">
            <h4 class="header-brand-title">YounixLabs</h4>
          </div>

          <div class="header-right-container">
            <h5 class="header-title">URL Encoder/Decoder</h5>
            <button
              id="theme-toggle"
              class="btn btn--ghost btn--sm"
              title="Toggle theme"
            >
              <span class="theme-icon">🌓</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-card">
          <span class="stat-label">Characters</span>
          <span id="char-count" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Lines</span>
          <span id="line-count" class="stat-value">1</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">URLs Found</span>
          <span id="url-count" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Operations</span>
          <span id="operation-count" class="stat-value">0</span>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="main-content">
        <div class="textarea-container">
          <textarea
            id="main-textarea"
            class="main-textarea"
            placeholder="Enter URLs, text, or paste encoded content here. Use the operation buttons below to process your content..."
            spellcheck="false"
          ></textarea>
        </div>

        <!-- Operation Buttons -->
        <div class="operations-section">
          <div class="operations-group">
            <h3 class="group-title">Primary Operations</h3>
            <div class="button-grid">
              <button
                id="url-encode"
                class="btn btn--default"
                title="URL Encode (Ctrl+E)"
              >
                <span class="btn-icon">🌐</span>
                URL Encode
              </button>
              <button
                id="url-decode"
                class="btn btn--default"
                title="URL Decode (Ctrl+D)"
              >
                <span class="btn-icon">🌐</span>
                URL Decode
              </button>
              <button
                id="base64-encode"
                class="btn btn--secondary"
                title="Base64 Encode (Ctrl+B)"
              >
                <span class="btn-icon">📝</span>
                Base64 Encode
              </button>
              <button
                id="base64-decode"
                class="btn btn--secondary"
                title="Base64 Decode (Ctrl+Shift+B)"
              >
                <span class="btn-icon">📝</span>
                Base64 Decode
              </button>
              <button
                id="html-encode"
                class="btn btn--outline"
                title="HTML Encode"
              >
                <span class="btn-icon">🏷️</span>
                HTML Encode
              </button>
              <button
                id="html-decode"
                class="btn btn--outline"
                title="HTML Decode"
              >
                <span class="btn-icon">🏷️</span>
                HTML Decode
              </button>
            </div>
          </div>

          <!-- Utility Section -->
          <div class="operations-group">
            <h3 class="group-title">Utilities</h3>
            <div class="utility-grid">
              <button
                id="extract-urls"
                class="btn btn--ghost"
                title="Extract URLs (Ctrl+U)"
              >
                <span class="btn-icon">🔗</span>
                Extract URLs
              </button>
              <button
                id="extract-emails"
                class="btn btn--ghost"
                title="Extract Emails"
              >
                <span class="btn-icon">📧</span>
                Extract Emails
              </button>
              <button
                id="auto-detect"
                class="btn btn--ghost"
                title="Auto Detect & Fix"
              >
                <span class="btn-icon">🎯</span>
                Auto Detect
              </button>
              <button
                id="clear-all"
                class="btn btn--ghost"
                title="Clear All (Ctrl+L)"
              >
                <span class="btn-icon">🗑️</span>
                Clear All
              </button>
              <button
                id="copy-content"
                class="btn btn--ghost"
                title="Copy Content"
              >
                <span class="btn-icon">📋</span>
                Copy Content
              </button>
              <button
                id="upload-file"
                class="btn btn--ghost"
                title="Upload File"
              >
                <span class="btn-icon">📁</span>
                Upload File
              </button>
            </div>
          </div>
        </div>

        <!-- Control Buttons -->
        <div class="control-bar">
          <div class="control-group">
            <button
              id="undo"
              class="btn btn--ghost btn--sm"
              title="Undo (Ctrl+Z)"
              disabled
            >
              <span class="btn-icon">↶</span>
              Undo
            </button>
            <button
              id="redo"
              class="btn btn--ghost btn--sm"
              title="Redo (Ctrl+Y)"
              disabled
            >
              <span class="btn-icon">↷</span>
              Redo
            </button>
          </div>
          <div class="control-group">
            <div class="status-indicator">
              <span class="status-dot"></span>
              <span id="status-text">Ready</span>
            </div>
          </div>
        </div>
      </div>

      <!-- URL Analysis Panel -->
      <div class="analysis-panel card" id="analysis-panel">
        <div class="card-header">
          <h3 class="card-title">URL Analysis</h3>
        </div>
        <div class="card-content">
          <div id="url-breakdown" class="url-breakdown">
            <div class="empty-state">
              <span class="empty-icon">🌐</span>
              <p>Enter a URL to see component breakdown</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- File Input (Hidden) -->
    <input type="file" id="file-input" accept=".txt,.csv,.json,.xml" hidden />

    <script src="app.js"></script>
  </body>
</html>
